<div id="content">
<style><!--
        #content li {
            padding-left: 80px;
            text-indent: -80px;
        }
        #content li.highlight {
            background-color: #DCD4E6;
            font-weight: bold;
        }

        #schedule-list {
            /* Reserve space for ~50 items on full pages to reduce jumpiness.
               On the last page we intentionally let it shrink (see .last-page). */
            min-height: 1100px;
        }
        #schedule-list.last-page {
            /* Last page has fewer items: allow natural (short) height so the
               pager buttons sit directly under the last radio program. */
            min-height: 0;
        }

        #radio-pager {
            margin: 6px 0 2px;
            text-align: center;
            font-size: 0.9em;
        }
        #radio-pager button {
            padding: 1px 8px;
            font-size: 0.9em;
            vertical-align: middle;
        }
--></style>
<script type="text/javascript">// <![CDATA[
const SCHEDULE_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/radio-schedule.txt";
const PAGE_SIZE = 50;

/*
 * The source file (docs/radio-schedule.txt) is pure data:
 *   - Simple flat list, one line per broadcast.
 *   - Format: "Fri, Jul 3, 2026: Title"
 */

function decodeHtmlEntities(str) {
    const el = document.createElement("textarea");
    el.innerHTML = str;
    return el.value;
}

function getPacificOffset(date) {
    const pacificString = date.toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric',
        hour12: false
    });
    const [datePart, timePart] = pacificString.split(', ');
    const [month, day, year] = datePart.split('/').map(Number);
    const [hour, minute, second] = timePart.split(':').map(Number);
    const pacificDate = new Date(year, month - 1, day, hour, minute, second);
    const utcDate = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()));
    return (pacificDate - utcDate) / (1000 * 60);
}

function highlightUpcoming(ul) {
    const now = new Date();
    const pacificOffsetMinutes = getPacificOffset(now);
    const userOffsetMinutes = now.getTimezoneOffset();
    const offsetDiffHours = (userOffsetMinutes - pacificOffsetMinutes) / 60;
    const nowPacific = new Date(now.getTime() + offsetDiffHours * 60 * 60 * 1000);
    const todayMidnight = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate());

    const broadcastHourPT = 12;
    const broadcastMinute = 30;
    const broadcastTime = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate(), broadcastHourPT, broadcastMinute);
    const targetDate = nowPacific < broadcastTime ? todayMidnight : new Date(todayMidnight.getTime() + 24 * 60 * 60 * 1000);

    console.log('Target Date for highlight:', targetDate.toString());

    const dateRegex = /^(?:[A-Za-z]+,\s)?([A-Za-z]+)\s(\d{1,2}),\s(\d{4})/;

    let closestDate = null;
    let closestLi = null;
    let minDiff = Infinity;

    const listItems = ul ? ul.querySelectorAll('li') : document.querySelectorAll('#content ul li');

    listItems.forEach(li => {
        const text = li.textContent || '';
        const match = text.match(dateRegex);
        if (match) {
            const month = match[1];
            const day = parseInt(match[2], 10);
            const year = parseInt(match[3], 10);
            const liDate = new Date(year, new Date(`${month} 1, ${year}`).getMonth(), day);

            const diff = liDate - targetDate;
            if (diff >= 0 && diff < minDiff) {
                minDiff = diff;
                closestDate = liDate;
                closestLi = li;
            }
        }
    });

    if (closestLi) {
        closestLi.classList.add('highlight');
    }
}

let allRadioLines = [];
let currentRadioPage = 0;
let radioUl = null;
let isFirstRender = true;

function getJQ() {
    if (typeof jQ !== 'undefined') return jQ;
    if (typeof jQuery !== 'undefined') return jQuery;
    return null;
}

function findBestStartingPage(lines) {
    // Try to find the index of the closest upcoming broadcast so we can default to that page
    const now = new Date();
    const pacificOffsetMinutes = getPacificOffset(now);
    const userOffsetMinutes = now.getTimezoneOffset();
    const offsetDiffHours = (userOffsetMinutes - pacificOffsetMinutes) / 60;
    const nowPacific = new Date(now.getTime() + offsetDiffHours * 60 * 60 * 1000);
    const todayMidnight = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate());

    const broadcastHourPT = 12;
    const broadcastMinute = 30;
    const broadcastTime = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate(), broadcastHourPT, broadcastMinute);
    const targetDate = nowPacific < broadcastTime ? todayMidnight : new Date(todayMidnight.getTime() + 24 * 60 * 60 * 1000);

    const dateRegex = /^(?:[A-Za-z]+,\s)?([A-Za-z]+)\s(\d{1,2}),\s(\d{4})/;

    let bestIdx = 0;
    let minDiff = Infinity;

    lines.forEach((text, idx) => {
        const match = text.match(dateRegex);
        if (match) {
            const month = match[1];
            const day = parseInt(match[2], 10);
            const year = parseInt(match[3], 10);
            const liDate = new Date(year, new Date(`${month} 1, ${year}`).getMonth(), day);
            const diff = liDate - targetDate;
            if (diff >= 0 && diff < minDiff) {
                minDiff = diff;
                bestIdx = idx;
            }
        }
    });

    return Math.floor(bestIdx / PAGE_SIZE);
}

function renderRadioPage(page) {
    if (!radioUl || !allRadioLines.length) return;

    const totalPages = Math.ceil(allRadioLines.length / PAGE_SIZE) || 1;
    currentRadioPage = Math.max(0, Math.min(page, totalPages - 1));

    const isLastPage = currentRadioPage === totalPages - 1;

    const wasFirstRender = isFirstRender;
    if (isFirstRender) {
        isFirstRender = false;
    }

    const pagerEl = document.getElementById('radio-pager');

    // Only capture previous position for compensation on non-first renders
    const rectBefore = (!wasFirstRender && pagerEl) ? pagerEl.getBoundingClientRect() : null;

    // On the last page we intentionally drop the min-height so the pager
    // sits directly under the (short) list content.
    if (isLastPage) {
        radioUl.classList.add('last-page');
    } else {
        radioUl.classList.remove('last-page');
    }

    const start = currentRadioPage * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, allRadioLines.length);
    const pageLines = allRadioLines.slice(start, end);

    radioUl.innerHTML = '';

    pageLines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = decodeHtmlEntities(line);
        radioUl.appendChild(li);
    });

    // Update pager UI
    updatePagerUI();

    // Re-run highlight on the visible items only
    highlightUpcoming(radioUl);

    if (pagerEl && !wasFirstRender && rectBefore) {
        // Keep the pager (Newer / Older buttons) at the same viewport position after
        // the DOM reflow. rectBefore tells us where the buttons were when the user
        // clicked; comparing to rectAfter tells us whether to scroll up or down.
        // This is especially important on the last page: dropping min-height shrinks
        // the list and moves the pager up in the document — without compensation the
        // browser can leave the viewport at the page bottom, hiding the Newer button.
        const settleFrames = isLastPage ? 2 : 1;
        const step = (remaining) => {
            if (remaining > 1) {
                requestAnimationFrame(() => step(remaining - 1));
                return;
            }
            requestAnimationFrame(() => {
                const rectAfter = pagerEl.getBoundingClientRect();
                const delta = rectAfter.top - rectBefore.top;
                if (delta !== 0) {
                    window.scrollBy(0, delta);
                }
            });
        };
        step(settleFrames);
    }
}

function updatePagerUI() {
    const totalPages = Math.ceil(allRadioLines.length / PAGE_SIZE) || 1;
    const start = currentRadioPage * PAGE_SIZE + 1;
    const end = Math.min((currentRadioPage + 1) * PAGE_SIZE, allRadioLines.length);
    const info = `Page ${currentRadioPage + 1} of ${totalPages} &nbsp;(${start}–${end} of ${allRadioLines.length})`;

    const j = getJQ();
    if (j) {
        j('#radio-page-info').html(info);

        // Hide button entirely when there's no data in that direction
        j('#radio-prev').toggle(currentRadioPage > 0);
        j('#radio-next').toggle(currentRadioPage < totalPages - 1);
        return;
    }

    // Vanilla fallback (no jQuery)
    const infoEl = document.getElementById('radio-page-info');
    if (infoEl) infoEl.innerHTML = info;

    const prev = document.getElementById('radio-prev');
    const next = document.getElementById('radio-next');
    if (prev) prev.style.display = (currentRadioPage > 0) ? '' : 'none';
    if (next) next.style.display = (currentRadioPage < totalPages - 1) ? '' : 'none';
}

function setupRadioPager(ul) {
    radioUl = ul;

    // Create pager controls if they don't exist
    const container = ul.parentNode || document.getElementById('content');
    let pager = document.getElementById('radio-pager');
    if (!pager) {
        pager = document.createElement('div');
        pager.id = 'radio-pager';
        pager.innerHTML = `
            <button type="button" id="radio-prev">« Newer 50</button>
            <span id="radio-page-info" style="margin: 0 10px; font-size: 0.9em;"></span>
            <button type="button" id="radio-next">Older 50 »</button>
        `;
        // Place the pager right after the list
        if (ul.nextSibling) {
            container.insertBefore(pager, ul.nextSibling);
        } else {
            container.appendChild(pager);
        }
    }

    const j = getJQ();
    if (!j) {
        // Fallback to vanilla if no jQuery available (should not happen on the site)
        const prev = document.getElementById('radio-prev');
        const next = document.getElementById('radio-next');
        if (prev) prev.onclick = () => renderRadioPage(currentRadioPage - 1);
        if (next) next.onclick = () => renderRadioPage(currentRadioPage + 1);
        return;
    }

    // Use jQ / jQuery as required by the site
    j('#radio-prev').off('click').on('click', function () {
        renderRadioPage(currentRadioPage - 1);
    });
    j('#radio-next').off('click').on('click', function () {
        renderRadioPage(currentRadioPage + 1);
    });
}

async function loadRadioSchedule() {
    const container = document.getElementById('content') || document.querySelector('#content');
    if (!container) return;

    // Prefer explicit #schedule-list, otherwise create after the <p>
    let ul = container.querySelector('#schedule-list') || container.querySelector('ul');
    if (!ul) {
        ul = document.createElement('ul');
        ul.id = 'schedule-list';
        const p = container.querySelector('p');
        if (p && p.nextSibling) {
            container.insertBefore(ul, p.nextSibling);
        } else {
            container.appendChild(ul);
        }
    }
    ul.innerHTML = '';

    try {
        const res = await fetch(SCHEDULE_URL, { cache: "no-store" });
        if (res.ok) {
            const txt = await res.text();
            allRadioLines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        } else {
            console.warn("Failed to fetch schedule, status", res.status);
            allRadioLines = [];
        }
    } catch (e) {
        console.warn("Could not load radio-schedule.txt:", e);
        allRadioLines = [];
    }

    if (allRadioLines.length === 0) {
        const li = document.createElement('li');
        li.textContent = "Unable to load schedule.";
        ul.appendChild(li);
        return;
    }

    // Wire up paging UI (uses jQ / jQuery)
    setupRadioPager(ul);

    // Force initial load to page 0 (top of the newest items).
    // We intentionally do not auto-select a "best" page on first load
    // because that was causing the page to scroll down to the middle.
    currentRadioPage = 0;

    // Render first page (the scroll adjustment logic inside renderRadioPage
    // will be skipped because of the isFirstRender flag).
    renderRadioPage(currentRadioPage);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRadioSchedule);
} else {
    loadRadioSchedule();
}
// ]]></script>

</div>
