<div id="content">
<style><!--
        #content li {
            padding-left: 0;
            text-indent: 0;
            list-style: none;
            margin: 0 0 0.35em 0;
        }
        #content li.highlight {
            background-color: #DCD4E6;
            font-weight: bold;
        }
        #content li.highlight .radio-line {
            font-weight: bold;
        }

        .radio-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            /* Keep hanging-indent feel for date:col text when no play btn spacer */
        }
        .radio-play {
            flex: 0 0 1.4em;
            width: 1.4em;
            height: 1.4em;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            color: #3a2a5c;
            font-size: 0.95em;
            line-height: 1.3;
            cursor: pointer;
            text-align: center;
        }
        .radio-play:hover {
            color: #6b4a9e;
        }
        .radio-play.is-playing {
            color: #1a7a3a;
        }
        .radio-play-spacer {
            flex: 0 0 1.4em;
            width: 1.4em;
            display: inline-block;
        }
        .radio-line {
            flex: 1 1 auto;
            /* hanging indent for "Day, Mon D, YYYY: " block (~80px) */
            padding-left: 80px;
            text-indent: -80px;
        }
        .radio-player-wrap {
            margin: 4px 0 10px 1.6em;

            background: #f4f1f8;
            border-radius: 4px;
            max-width: 28em;
        }
        .radio-player-wrap audio {
            width: 100%;
            height: 32px;
            vertical-align: middle;
        }
        .radio-player-wrap .radio-podbean-link {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.85em;
        }

        #schedule-list {
            /* Reserve space for ~50 items on full pages to reduce jumpiness.
               On the last page we intentionally let it shrink (see .last-page). */
            min-height: 1100px;
            padding-left: 0;
            margin-left: 0;
        }
        #schedule-list.last-page {
            /* Last page has fewer items: allow natural (short) height so the
               pager buttons sit directly under the last radio program. */
            min-height: 0;
        }

        #radio-pager {
            margin: 6px 0 2px;
            text-align: center;
            font-size: 0.9em;
        }
        #radio-pager button {
            padding: 1px 8px;
            font-size: 0.9em;
            vertical-align: middle;
        }
--></style>
<script type="text/javascript">// <![CDATA[
const SCHEDULE_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/radio-schedule.txt";
const MATCHES_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/podbean-radio-matches.json";
const MATCHES_ARCHIVE_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/podbean-radio-matches-archive.json";
const PAGE_SIZE = 50;

/*
 * docs/radio-schedule.txt — pure data lines: "Fri, Jul 3, 2026: Title"
 * docs/podbean-radio-matches.json — newest play links (active cap)
 * docs/podbean-radio-matches-archive.json — older matches; loaded on first Older click
 */

function decodeHtmlEntities(str) {
    const el = document.createElement("textarea");
    el.innerHTML = str;
    return el.value;
}

/** Map radioTitle -> { audioUrl, episodeUrl, ... } */
let podbeanByTitle = Object.create(null);
let matchesArchiveLoaded = false;
let matchesArchiveLoading = null; // Promise while in flight

function mergeMatchIndex(data) {
    const list = (data && data.matches) ? data.matches : [];
    list.forEach(function (m) {
        if (!m || !m.radioTitle) return;
        const key = String(m.radioTitle).trim();
        if (!key) return;
        // First strong match wins; do not overwrite active with archive
        if (!podbeanByTitle[key]) {
            podbeanByTitle[key] = m;
        }
    });
}

function ensureMatchesArchiveLoaded() {
    if (matchesArchiveLoaded) {
        return Promise.resolve(false);
    }
    if (matchesArchiveLoading) {
        return matchesArchiveLoading;
    }
    matchesArchiveLoading = fetch(MATCHES_ARCHIVE_URL, { cache: "no-store" })
        .then(function (res) {
            if (!res || !res.ok) {
                // No archive file yet (few matches) — fine
                matchesArchiveLoaded = true;
                return false;
            }
            return res.json().then(function (data) {
                mergeMatchIndex(data);
                matchesArchiveLoaded = true;
                return true;
            });
        })
        .catch(function (e) {
            console.warn("Could not load podbean-radio-matches-archive.json:", e);
            matchesArchiveLoaded = true; // do not retry every click
            return false;
        })
        .finally(function () {
            matchesArchiveLoading = null;
        });
    return matchesArchiveLoading;
}

function parseScheduleLine(line) {
    const text = decodeHtmlEntities(line);
    const idx = text.indexOf(":");
    if (idx < 0) {
        return { displayDate: "", title: text, full: text };
    }
    // "Fri, Jul 3, 2026: Title" — first colon separates date header from title
    return {
        displayDate: text.slice(0, idx).trim(),
        title: text.slice(idx + 1).trim(),
        full: text
    };
}

function getPacificOffset(date) {
    const pacificString = date.toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric',
        hour12: false
    });
    const [datePart, timePart] = pacificString.split(', ');
    const [month, day, year] = datePart.split('/').map(Number);
    const [hour, minute, second] = timePart.split(':').map(Number);
    const pacificDate = new Date(year, month - 1, day, hour, minute, second);
    const utcDate = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()));
    return (pacificDate - utcDate) / (1000 * 60);
}

function highlightUpcoming(ul) {
    const now = new Date();
    const pacificOffsetMinutes = getPacificOffset(now);
    const userOffsetMinutes = now.getTimezoneOffset();
    const offsetDiffHours = (userOffsetMinutes - pacificOffsetMinutes) / 60;
    const nowPacific = new Date(now.getTime() + offsetDiffHours * 60 * 60 * 1000);
    const todayMidnight = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate());

    const broadcastHourPT = 12;
    const broadcastMinute = 30;
    const broadcastTime = new Date(nowPacific.getFullYear(), nowPacific.getMonth(), nowPacific.getDate(), broadcastHourPT, broadcastMinute);
    const targetDate = nowPacific < broadcastTime ? todayMidnight : new Date(todayMidnight.getTime() + 24 * 60 * 60 * 1000);

    const dateRegex = /^(?:[A-Za-z]+,\s)?([A-Za-z]+)\s(\d{1,2}),\s(\d{4})/;

    let closestLi = null;
    let minDiff = Infinity;

    const listItems = ul ? ul.querySelectorAll('li') : document.querySelectorAll('#content ul li');

    listItems.forEach(li => {
        const text = (li.getAttribute('data-line') || li.textContent || '');
        const match = text.match(dateRegex);
        if (match) {
            const month = match[1];
            const day = parseInt(match[2], 10);
            const year = parseInt(match[3], 10);
            const liDate = new Date(year, new Date(`${month} 1, ${year}`).getMonth(), day);

            const diff = liDate - targetDate;
            if (diff >= 0 && diff < minDiff) {
                minDiff = diff;
                closestLi = li;
            }
        }
    });

    if (closestLi) {
        closestLi.classList.add('highlight');
    }
}

let allRadioLines = [];
let currentRadioPage = 0;
let radioUl = null;
let isFirstRender = true;
/** Currently open player li (only one expanded at a time) */
let activePlayerLi = null;

function getJQ() {
    if (typeof jQ !== 'undefined') return jQ;
    if (typeof jQuery !== 'undefined') return jQuery;
    return null;
}

function stopAllAudio(exceptAudio) {
    if (!radioUl) return;
    radioUl.querySelectorAll('audio').forEach(function (a) {
        if (exceptAudio && a === exceptAudio) return;
        try {
            a.pause();
            a.currentTime = 0;
        } catch (e) { /* ignore */ }
    });
    radioUl.querySelectorAll('.radio-play.is-playing').forEach(function (btn) {
        if (exceptAudio && btn.closest('li') && btn.closest('li').querySelector('audio') === exceptAudio) return;
        btn.classList.remove('is-playing');
        btn.setAttribute('aria-label', 'Play');
        btn.textContent = '\u25B6'; // ▶
    });
}

function closePlayer(li) {
    if (!li) return;
    const wrap = li.querySelector('.radio-player-wrap');
    const btn = li.querySelector('.radio-play');
    const audio = li.querySelector('audio');
    if (audio) {
        try { audio.pause(); } catch (e) { /* ignore */ }
    }
    if (wrap) wrap.hidden = true;
    if (btn) {
        btn.classList.remove('is-playing');
        btn.setAttribute('aria-label', 'Play');
        btn.textContent = '\u25B6';
    }
    if (activePlayerLi === li) activePlayerLi = null;
}

function openPlayer(li) {
    if (!li) return;
    if (activePlayerLi && activePlayerLi !== li) {
        closePlayer(activePlayerLi);
    }
    const wrap = li.querySelector('.radio-player-wrap');
    const btn = li.querySelector('.radio-play');
    const audio = li.querySelector('audio');
    if (!wrap || !audio) return;
    wrap.hidden = false;
    activePlayerLi = li;
    if (btn) {
        btn.classList.add('is-playing');
        btn.setAttribute('aria-label', 'Pause');
        btn.textContent = '\u23F8'; // ⏸
    }
    stopAllAudio(audio);
    const p = audio.play();
    if (p && typeof p.catch === 'function') {
        p.catch(function () { /* autoplay blocked until user gesture — click already is gesture */ });
    }
}

function togglePlayer(li) {
    const wrap = li.querySelector('.radio-player-wrap');
    const audio = li.querySelector('audio');
    if (!wrap || !audio) return;
    if (!wrap.hidden && !audio.paused) {
        audio.pause();
        const btn = li.querySelector('.radio-play');
        if (btn) {
            btn.classList.remove('is-playing');
            btn.setAttribute('aria-label', 'Play');
            btn.textContent = '\u25B6';
        }
        return;
    }
    openPlayer(li);
}

function createScheduleItem(line) {
    const parsed = parseScheduleLine(line);
    const match = podbeanByTitle[parsed.title] || null;
    const hasAudio = !!(match && match.audioUrl);

    const li = document.createElement('li');
    li.className = 'radio-item' + (hasAudio ? ' has-audio' : '');
    li.setAttribute('data-line', parsed.full);

    const row = document.createElement('div');
    row.className = 'radio-row';

    if (hasAudio) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'radio-play';
        btn.setAttribute('aria-label', 'Play');
        btn.title = 'Play audio';
        btn.textContent = '\u25B6';
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            togglePlayer(li);
        });
        row.appendChild(btn);
    } else {
        const spacer = document.createElement('span');
        spacer.className = 'radio-play-spacer';
        spacer.setAttribute('aria-hidden', 'true');
        row.appendChild(spacer);
    }

    const span = document.createElement('span');
    span.className = 'radio-line';
    span.textContent = parsed.full;
    row.appendChild(span);
    li.appendChild(row);

    if (hasAudio) {
        const wrap = document.createElement('div');
        wrap.className = 'radio-player-wrap';
        wrap.hidden = true;

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'none';
        audio.src = match.audioUrl;
        audio.addEventListener('play', function () {
            stopAllAudio(audio);
            const b = li.querySelector('.radio-play');
            if (b) {
                b.classList.add('is-playing');
                b.setAttribute('aria-label', 'Pause');
                b.textContent = '\u23F8';
            }
            activePlayerLi = li;
        });
        audio.addEventListener('pause', function () {
            const b = li.querySelector('.radio-play');
            if (b && audio.paused) {
                b.classList.remove('is-playing');
                b.setAttribute('aria-label', 'Play');
                b.textContent = '\u25B6';
            }
        });
        audio.addEventListener('ended', function () {
            const b = li.querySelector('.radio-play');
            if (b) {
                b.classList.remove('is-playing');
                b.setAttribute('aria-label', 'Play');
                b.textContent = '\u25B6';
            }
        });
        wrap.appendChild(audio);

        if (match.episodeUrl) {
            const a = document.createElement('a');
            a.className = 'radio-podbean-link';
            a.href = match.episodeUrl;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = 'Open on Podbean';
            wrap.appendChild(a);
        }

        li.appendChild(wrap);
    }

    return li;
}

function renderRadioPage(page) {
    if (!radioUl || !allRadioLines.length) return;

    const totalPages = Math.ceil(allRadioLines.length / PAGE_SIZE) || 1;
    currentRadioPage = Math.max(0, Math.min(page, totalPages - 1));

    const isLastPage = currentRadioPage === totalPages - 1;

    const wasFirstRender = isFirstRender;
    if (isFirstRender) {
        isFirstRender = false;
    }

    const pagerEl = document.getElementById('radio-pager');

    // Only capture previous position for compensation on non-first renders
    const rectBefore = (!wasFirstRender && pagerEl) ? pagerEl.getBoundingClientRect() : null;

    // On the last page we intentionally drop the min-height so the pager
    // sits directly under the (short) list content.
    if (isLastPage) {
        radioUl.classList.add('last-page');
    } else {
        radioUl.classList.remove('last-page');
    }

    const start = currentRadioPage * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, allRadioLines.length);
    const pageLines = allRadioLines.slice(start, end);

    activePlayerLi = null;
    radioUl.innerHTML = '';

    pageLines.forEach(function (line) {
        radioUl.appendChild(createScheduleItem(line));
    });

    // Update pager UI
    updatePagerUI();

    // Re-run highlight on the visible items only
    highlightUpcoming(radioUl);

    if (pagerEl && !wasFirstRender && rectBefore) {
        // Keep the pager (Newer / Older buttons) at the same viewport position after
        // the DOM reflow. rectBefore tells us where the buttons were when the user
        // clicked; comparing to rectAfter tells us whether to scroll up or down.
        // This is especially important on the last page: dropping min-height shrinks
        // the list and moves the pager up in the document — without compensation the
        // browser can leave the viewport at the page bottom, hiding the Newer button.
        const settleFrames = isLastPage ? 2 : 1;
        const step = (remaining) => {
            if (remaining > 1) {
                requestAnimationFrame(() => step(remaining - 1));
                return;
            }
            requestAnimationFrame(() => {
                const rectAfter = pagerEl.getBoundingClientRect();
                const delta = rectAfter.top - rectBefore.top;
                if (delta !== 0) {
                    window.scrollBy(0, delta);
                }
            });
        };
        step(settleFrames);
    }
}

function updatePagerUI() {
    const totalPages = Math.ceil(allRadioLines.length / PAGE_SIZE) || 1;
    const start = currentRadioPage * PAGE_SIZE + 1;
    const end = Math.min((currentRadioPage + 1) * PAGE_SIZE, allRadioLines.length);
    const info = `Page ${currentRadioPage + 1} of ${totalPages} &nbsp;(${start}–${end} of ${allRadioLines.length})`;

    const j = getJQ();
    if (j) {
        j('#radio-page-info').html(info);

        // Hide button entirely when there's no data in that direction
        j('#radio-prev').toggle(currentRadioPage > 0);
        j('#radio-next').toggle(currentRadioPage < totalPages - 1);
        return;
    }

    // Vanilla fallback (no jQuery)
    const infoEl = document.getElementById('radio-page-info');
    if (infoEl) infoEl.innerHTML = info;

    const prev = document.getElementById('radio-prev');
    const next = document.getElementById('radio-next');
    if (prev) prev.style.display = (currentRadioPage > 0) ? '' : 'none';
    if (next) next.style.display = (currentRadioPage < totalPages - 1) ? '' : 'none';
}

function setupRadioPager(ul) {
    radioUl = ul;

    // Create pager controls if they don't exist
    const container = ul.parentNode || document.getElementById('content');
    let pager = document.getElementById('radio-pager');
    if (!pager) {
        pager = document.createElement('div');
        pager.id = 'radio-pager';
        pager.innerHTML = `
            <button type="button" id="radio-prev">« Newer 50</button>
            <span id="radio-page-info" style="margin: 0 10px; font-size: 0.9em;"></span>
            <button type="button" id="radio-next">Older 50 »</button>
        `;
        // Place the pager right after the list
        if (ul.nextSibling) {
            container.insertBefore(pager, ul.nextSibling);
        } else {
            container.appendChild(pager);
        }
    }

    function goNewer() {
        renderRadioPage(currentRadioPage - 1);
    }

    // Older pages may need archive play matches; load once, then re-render.
    function goOlder() {
        const target = currentRadioPage + 1;
        ensureMatchesArchiveLoaded().then(function () {
            renderRadioPage(target);
        });
    }

    const j = getJQ();
    if (!j) {
        // Fallback to vanilla if no jQuery available (should not happen on the site)
        const prev = document.getElementById('radio-prev');
        const next = document.getElementById('radio-next');
        if (prev) prev.onclick = goNewer;
        if (next) next.onclick = goOlder;
        return;
    }

    // Use jQ / jQuery as required by the site
    j('#radio-prev').off('click').on('click', goNewer);
    j('#radio-next').off('click').on('click', goOlder);
}

async function loadRadioSchedule() {
    const container = document.getElementById('content') || document.querySelector('#content');
    if (!container) return;

    // Prefer explicit #schedule-list, otherwise create after the <p>
    let ul = container.querySelector('#schedule-list') || container.querySelector('ul');
    if (!ul) {
        ul = document.createElement('ul');
        ul.id = 'schedule-list';
        const p = container.querySelector('p');
        if (p && p.nextSibling) {
            container.insertBefore(ul, p.nextSibling);
        } else {
            container.appendChild(ul);
        }
    }
    ul.innerHTML = '';

    // Load schedule + optional Podbean match map in parallel
    try {
        const [schedRes, matchRes] = await Promise.all([
            fetch(SCHEDULE_URL, { cache: "no-store" }),
            fetch(MATCHES_URL, { cache: "no-store" }).catch(function () { return null; })
        ]);

        if (schedRes.ok) {
            const txt = await schedRes.text();
            allRadioLines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        } else {
            console.warn("Failed to fetch schedule, status", schedRes.status);
            allRadioLines = [];
        }

        podbeanByTitle = Object.create(null);
        matchesArchiveLoaded = false;
        if (matchRes && matchRes.ok) {
            try {
                const data = await matchRes.json();
                mergeMatchIndex(data);
                // If generator says there is no archive, skip later Older fetch
                if (data && data.hasArchive === false) {
                    matchesArchiveLoaded = true;
                }
            } catch (e) {
                console.warn("Could not parse podbean-radio-matches.json:", e);
            }
        }
    } catch (e) {
        console.warn("Could not load radio schedule / matches:", e);
        allRadioLines = [];
        podbeanByTitle = Object.create(null);
    }

    if (allRadioLines.length === 0) {
        const li = document.createElement('li');
        li.textContent = "Unable to load schedule.";
        ul.appendChild(li);
        return;
    }

    // Wire up paging UI (uses jQ / jQuery)
    setupRadioPager(ul);

    // Force initial load to page 0 (top of the newest items).
    // We intentionally do not auto-select a "best" page on first load
    // because that was causing the page to scroll down to the middle.
    currentRadioPage = 0;

    // Render first page (the scroll adjustment logic inside renderRadioPage
    // will be skipped because of the isFirstRender flag).
    renderRadioPage(currentRadioPage);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRadioSchedule);
} else {
    loadRadioSchedule();
}
// ]]></script>
<h4>Radio Broadcast</h4>
<p><a href="https://www.vsmtools.com/U/566/ReviewFiles/radio-stations.aspx">ACN American Christian Network :&nbsp;</a>Weekdays 11:30 AM &amp; 3 PM (PT)</p>
<ul id="schedule-list"></ul>
</div>
