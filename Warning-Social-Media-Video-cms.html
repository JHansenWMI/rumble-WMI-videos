<!-- Page stats (page-specific; stays in CMS shell) -->
<div id="counterBox" style="color: #ccc; font-size: 12px; text-align: center; margin-top: 40px; cursor: pointer;">Loading stats...</div>
<div id="statsModalOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999999;">
<div id="statsModal" style="background: #fff; border-radius: 10px; width: min(900px, 92vw); max-height: 85vh; box-shadow: 0 10px 30px rgba(0,0,0,0.35); display: flex; flex-direction: column; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #e6e6e6;">
<div style="font: 600 14px/1.2 system-ui, -apple-system, Segoe UI, Arial;">Page stats (last 60 days)</div>
<button id="statsModalCloseBtn" type="button" style="border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px;" aria-label="Close">&times;</button></div>
<div style="padding: 12px 14px;">
<div id="statsModalContent" style="white-space: pre; overflow: auto; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 65vh;"></div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding: 12px 14px; border-top: 1px solid #e6e6e6;"><button id="statsModalCopyBtn" type="button" style="border: 1px solid #ccc; background: #f7f7f7; border-radius: 6px; padding: 8px 10px; cursor: pointer; font: 600 12px system-ui;"> Copy </button> <button id="statsModalOkBtn" type="button" style="border: 1px solid #999; background: #eee; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: 700 12px system-ui;"> OK </button></div>
</div>
</div>
<script type="text/javascript">// <![CDATA[
(function () {
  const WORKER_BASE = "https://divine-dew-3ed7.jonathan-hansen-ministries.workers.dev";
  const PAGE_ID = "watch-warning"; // CHANGE PER PAGE: watch-warning | reading | donate

  const overlay = document.getElementById("statsModalOverlay");
  const content = document.getElementById("statsModalContent");
  const btnClose = document.getElementById("statsModalCloseBtn");
  const btnOk = document.getElementById("statsModalOkBtn");
  const btnCopy = document.getElementById("statsModalCopyBtn");
  const counterBox = document.getElementById("counterBox");

  if (!overlay || !content || !btnClose || !btnOk || !btnCopy || !counterBox) return;

  let busy = false;
  let lastDay = null;
  let lastMonth = null;

  function setCounterText(extra) {
    const day = (lastDay ?? "?");
    const month = (lastMonth ?? "?");
    counterBox.innerText = `Day: ${day} | Month: ${month}` + (extra ? ` ${extra}` : "");
  }

  function setBusy(on) {
    busy = on;
    counterBox.style.pointerEvents = on ? "none" : "auto";
    setCounterText(on ? "(checking)" : "");
  }

  function closeModal() {
    overlay.style.display = "none";
    if (busy) setBusy(false);
  }

  function openModal(text) {
    content.textContent = text || "";
    overlay.style.display = "flex";
  }

  btnClose.addEventListener("click", closeModal);
  btnOk.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if (overlay.style.display === "flex" && e.key === "Escape") closeModal(); });

  btnCopy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(content.textContent || "");
      btnCopy.textContent = "Copied";
      setTimeout(() => (btnCopy.textContent = "Copy"), 1200);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = content.textContent || "";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      btnCopy.textContent = "Copied";
      setTimeout(() => (btnCopy.textContent = "Copy"), 1200);
    }
  });

  const sessionKey = "wm_counted:" + PAGE_ID;
  const endpoint = sessionStorage.getItem(sessionKey) ? "/peek" : "/count";

  fetch(WORKER_BASE + endpoint + "?page=" + encodeURIComponent(PAGE_ID))
    .then(r => r.json())
    .then(data => {
      if (!sessionStorage.getItem(sessionKey) && !data.skipped) {
        sessionStorage.setItem(sessionKey, "1");
      }
      lastDay = data.day;
      lastMonth = data.month;
      setCounterText("");
    })
    .catch(() => setCounterText("(counts unavailable)"));

  counterBox.addEventListener("click", () => {
    if (busy) return;
    setBusy(true);

    fetch(WORKER_BASE + "/stats?page=" + encodeURIComponent(PAGE_ID))
      .then(r => r.json())
      .then(data => {
        const days = data.last60days || [];
        const top = data.topIPsToday || [];

        let text = "Last 60 Days:\n";
        days.forEach(d => {
          const adj = (d.countMinusTopIps ?? "(n/a)");
          text += `${d.date}: ${d.count} (minus top IPs: ${adj})\n`;
        });

        text += "\nTop 3 IP hashes today:\n";
        top.forEach(x => {
          text += `${String(x.ipHash).slice(0,12)}... : ${x.count}\n`;
        });

        openModal(text);
      })
      .catch(err => openModal("Could not load stats:\n" + err));
  });

})();
// ]]></script>
