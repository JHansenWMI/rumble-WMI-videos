name: Import KZN Tongaat itinerary update
on:
  push:
    paths:
      - "docs/scripts/apply-kzn-tongaat-patch.py"
      - "docs/itinerary-assets/*.jpg.b64"
      - "docs/itinerary-assets/*.jpg.b64.c*"
      - "docs/kzn-tongaat-events-patch.json"
      - "docs/kzn-tongaat-events-patch.json.p*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode flyers and merge event patch
        run: python3 docs/scripts/apply-kzn-tongaat-patch.py
      - name: Commit published itinerary and flyers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add docs/international-itinerary.json || true
          jpgs=(docs/itinerary-assets/*.jpg)
          if ((${#jpgs[@]})); then git add -- "${jpgs[@]}"; fi
          git add -u -- docs/itinerary-assets || true
          git add -u -- docs/kzn-tongaat-events-patch.json 2>/dev/null || true
          parts=(docs/kzn-tongaat-events-patch.json.p*)
          if ((${#parts[@]})); then git add -u -- "${parts[@]}"; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add KZN Celebration Centre Tongaat flyer images 30 Sep–4 Oct 2026"
          git push
