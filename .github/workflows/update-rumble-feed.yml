name: Update Rumble Feed JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rumble-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        run: python generate_rumble_feed.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rumble-feed.json

          if git diff --cached --quiet -- rumble-feed.json; then
            echo "No changes to commit"
          else
            git commit -m "Update rumble-feed.json - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
