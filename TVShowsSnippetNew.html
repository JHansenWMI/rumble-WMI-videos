/* Video card styles (adapted for list use) */
.rw-card {
  position: relative;

.rw-thumbWrap {
  position: relative;
  width: 120px;
  min-width: 120px;
  flex-shrink: 0;
  aspect-ratio: 16 / 9;
  background: rgba(0,0,0,0.08);
  overflow: hidden;
}
.rw-thumbWrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--rw-thumb-bg, none);
  background-position: center;
  background-size: cover;
  filter: blur(12px);
  opacity: 0;
  transform: scale(1.06);

  position: relative;
  z-index: 1;

  opacity: 0.7;
}
.rw-card:hover { filter: brightness(0.98); }
.rw-card:active { filter: brightness(0.96); }

@media (max-width: 420px) {
  .rw-card { flex-direction: column; }
  .rw-thumbWrap { width: 100%; min-width: 0; }
}

/* Rumble overlay player styles */

<script type="text/javascript">// <![CDATA[
const FEED_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/tv-feed.json";
const SCHEDULE_URL = "https://jhansenwmi.github.io/rumble-WMI-videos/tv-schedule.txt";

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (m) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
  });
}

function normalizeTitle(t) {
  let s = String(t || "").replace(/\s+/g, " ").trim();
  s = stripTVSuffix(s);
  s = stripTrailingDate(s);
  return s;
}

function stripTrailingDate(title) {
  const re = /\s*-\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}(?:st|nd|rd|th)?(?:,)?\s+\d{4}\s*$/i;
  return title.replace(re, "").trim();
}

function stripTVSuffix(title) {
  return title.replace(/\s*TV\d{8}\s*$/i, "").trim();
}

const dateFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Los_Angeles",
  month: "short",
  day: "2-digit",
  year: "numeric"
});

function getTVDateMatch(item) {
  let text = item && item.title ? String(item.title) : "";
  let m = text.match(/TV(\d{4})(\d{2})(\d{2})\s*$/i);
  if (!m && item && item.link) {
    text = String(item.link);
    m = text.match(/tv(\d{4})(\d{2})(\d{2})\b/i);
  }
  return m;
}

function getTVAirDate(item) {
  const m = getTVDateMatch(item);
  if (!m) return null;
  const y = +m[1];
  const mo = +m[2];
  const d = +m[3];
  let dt = new Date(Date.UTC(y, mo - 1, d, 12, 0, 0));
  const dow = dt.getUTCDay();
  if (dow === 5) return dt;
  const toPrev = (dow - 5 + 7) % 7;
  const toNext = (5 - dow + 7) % 7;
  let delta = (toPrev <= toNext) ? -toPrev : toNext;
  dt.setUTCDate(dt.getUTCDate() + delta);
  return dt;
}

function getTVAirDateStr(item) {
  const dt = getTVAirDate(item);
  if (!dt) return "";
  return dateFmt.format(dt);
}

function getThumb(item) {
  return item && item["media:content"] ? String(item["media:content"]) : "";
}

function getLink(item) {
  return item && item.link ? String(item.link) : "#";
}

function getVideoId(item) {
  if (item && item.videoId) return String(item.videoId);
  const link = item && item.link ? String(item.link) : "";
  const m = link.match(/\/(v[a-z0-9]+)-/);
  return m ? m[1] : "";
}

function attachCardClicks() {
  const root = document.getElementById('content') || document;
  root.querySelectorAll('.rw-card[data-video-id]').forEach(card => {
    const videoId = card.getAttribute('data-video-id');
    if (!videoId) return;
    const thumbWrap = card.querySelector('.rw-thumbWrap');
    const titleWrap = card.querySelector('.rw-title');
    const openPlayer = (e) => {
      if (e && (e.metaKey || e.ctrlKey || e.shiftKey)) {
        const lnk = card.getAttribute('data-link');
        if (lnk) window.open(lnk, '_blank');
        return;
      }
      e && e.preventDefault();
      showRumbleOverlay(videoId);
    };
    if (thumbWrap) thumbWrap.style.cursor = 'pointer';
    if (titleWrap) titleWrap.style.cursor = 'pointer';
    if (thumbWrap) thumbWrap.addEventListener('click', openPlayer);
    if (titleWrap) titleWrap.addEventListener('click', openPlayer);
    card.style.cursor = 'pointer';
    card.addEventListener('click', (e) => {
      if (e.target.closest('.rw-thumbWrap') || e.target.closest('.rw-title')) return;
      openPlayer(e);
    });
  });
}

const RUMBLE_MODAL_Z_INDEX = 10000;

function ensureRumbleModalPortal() {
  const modal = document.getElementById('rumbleModal');
  if (!modal) return null;
  if (modal.parentNode !== document.body) {
    document.body.appendChild(modal);
  }
  modal.style.zIndex = String(RUMBLE_MODAL_Z_INDEX);
  return modal;
}

function showRumbleOverlay(videoCode) {
  if (!videoCode) return;
  wireRumbleModalHandlers();
  let modal = ensureRumbleModalPortal();
  if (!modal) return;
  const wrap = document.getElementById('rumblePlayerWrap');
  if (!wrap) return;
  const playerId = 'rumble_embed_' + videoCode.replace(/[^a-z0-9]/gi, '');
  wrap.innerHTML = `<div id="${playerId}" style="width:100%; aspect-ratio:16/9; min-height: 300px;"></div>`;
  modal.style.display = 'flex';
  const doPlay = () => {
    if (window.Rumble && typeof window.Rumble === 'function') {
      try { window.Rumble("play", { video: videoCode, div: playerId }); }
      catch (err) { console.warn('Rumble play error', err); }
    } else {
      setTimeout(doPlay, 250);
    }
  };
  setTimeout(doPlay, 60);
}

function closeRumbleOverlay() {
  const modal = document.getElementById('rumbleModal');
  const wrap = document.getElementById('rumblePlayerWrap');
  if (modal) modal.style.display = 'none';
  if (wrap) wrap.innerHTML = '';
}

let rumbleModalHandlersWired = false;
function wireRumbleModalHandlers() {
  if (rumbleModalHandlersWired) return;
  const modal = ensureRumbleModalPortal();
  const closeBtn = document.getElementById('rumbleModalClose');
  if (!modal || !closeBtn) return;
  rumbleModalHandlersWired = true;
  closeBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    closeRumbleOverlay();
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeRumbleOverlay();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    const m = document.getElementById('rumbleModal');
    if (m && m.style.display === 'flex') closeRumbleOverlay();
  });
}

function isShort(item) {
  const link = getLink(item);
  const source = item && item.sourcePage ? String(item.sourcePage) : "";
  const title = item && item.title ? String(item.title) : "";
  return /\/shorts(\/|$)/i.test(link) || /\/shorts(\/|$)/i.test(source) || /#shorts\b/i.test(title);
}

// TV feed / schedule matching:
// - Titles ending TV{YYYYMMDD}: match schedule rows by that air date (all channels).
// - WMI TV Broadcast History without TV{date}: match by normalized title only;
//   display date comes from tv-schedule.txt (do not use Rumble pubDate for matching).
// - Broadcast History + TV{date}: still shown here; not on the main CMS feed grid.
const CHANNEL_BROADCAST_HISTORY = "WMI TV Broadcast History";

function channelNameOf(item) {
  return item && item.channelName ? String(item.channelName).trim() : "";
}

function isTVShowItem(item) {
  const title = item && item.title ? String(item.title) : "";
  return /TV\d{8}\s*$/i.test(title);
}

function isBroadcastHistoryChannel(item) {
  return channelNameOf(item) === CHANNEL_BROADCAST_HISTORY;
}

/** Items eligible for the TV schedule list (from tv-feed.json). */
function isTvScheduleVideo(item) {
  if (isTVShowItem(item)) return true;
  // History channel uploads without TV{date} still pair to schedule by title
  return isBroadcastHistoryChannel(item);
}

function titleMatchKey(title) {
  return normalizeTitle(title).toLowerCase();
}

function parseScheduleEntry(entry) {
  const m = entry.match(/^(.*?):\s*(.*)$/);
  if (!m) return { displayDate: entry, title: entry };
  return { displayDate: m[1].trim(), title: m[2].trim() };
}

function getDateKey(displayDateStr) {
  // Parse "Jun 19, 2026" or "Mar 6, 2026" etc. and format consistently using the same formatter
  const match = displayDateStr.match(/([A-Za-z]+)\s+(\d{1,2}),\s+(\d{4})/);
  if (!match) return null;
  const month = match[1];
  const day = parseInt(match[2], 10);
  const year = parseInt(match[3], 10);
  const d = new Date(`${month} ${day}, ${year}`);
  if (isNaN(d.getTime())) return null;
  return dateFmt.format(d);
}

function renderVideoCard(video, scheduleDisplayDate, scheduleTitle) {
  // Prefer cleaned schedule title when present; else Rumble title (normalized).
  const fromSchedule = scheduleTitle && String(scheduleTitle).trim();
  const title = fromSchedule || normalizeTitle(video && video.title) || scheduleDisplayDate;
  const link = getLink(video);
  const thumb = getThumb(video);
  const date = scheduleDisplayDate || getTVAirDateStr(video);
  const videoId = getVideoId ? getVideoId(video) : (video && video.videoId ? video.videoId : '');
  const shortClass = isShort(video) ? " rw-card--short" : "";
  const thumbStyle = thumb ? ` style="--rw-thumb-bg: url('${escapeHtml(thumb)}')"` : "";

  return `
    <div class="rw-card${shortClass}" data-video-id="${escapeHtml(videoId)}" data-link="${escapeHtml(link)}">
      <div class="rw-thumbWrap"${thumbStyle}>
        ${thumb ? `<img class="rw-thumb" src="${escapeHtml(thumb)}" >` : ""}
      </div>
      <div class="rw-meta">
        <div class="rw-title">${escapeHtml(title)}</div>
        <div class="rw-date">${escapeHtml(date)}</div>
      </div>
    </div>
  `;
}

async function loadAndRenderSchedule() {
  const container = document.querySelector('#content');
  if (!container) return;

  let ul = container.querySelector('ul');
  if (!ul) {
    ul = document.createElement('ul');
    container.appendChild(ul);
  }
  ul.innerHTML = '';

  // Fetch feed + schedule (both dynamic)
  // videoByDateKey: TV{YYYYMMDD} titles → schedule air date (never Rumble pubDate)
  // videoByTitleKey: Broadcast History without TV{date} → match schedule title
  let videoByDateKey = new Map();
  let videoByTitleKey = new Map();
  let schedule = [];
  try {
    const [feedRes, schedRes] = await Promise.allSettled([
      fetch(FEED_URL, { cache: "no-store" }),
      fetch(SCHEDULE_URL, { cache: "no-store" }),
    ]);

    if (feedRes.status === "fulfilled" && feedRes.value.ok) {
      const data = await feedRes.value.json();
      let items = (data && Array.isArray(data.items)) ? data.items : [];
      items = items.filter(isTvScheduleVideo);
      items.forEach(item => {
        if (isTVShowItem(item)) {
          const key = getTVAirDateStr(item);
          if (key) videoByDateKey.set(key, item);
        } else if (isBroadcastHistoryChannel(item)) {
          // No TV{date}: title-only match; schedule supplies the display date
          const tKey = titleMatchKey(item.title);
          if (tKey) videoByTitleKey.set(tKey, item);
        }
      });
    } else if (feedRes.status === "rejected") {
      console.warn("Could not load video feed:", feedRes.reason);
    }

    if (schedRes.status === "fulfilled" && schedRes.value.ok) {
      const txt = await schedRes.value.text();
      schedule = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    } else if (schedRes.status === "rejected") {
      console.warn("Could not load TV schedule:", schedRes.reason);
    }
  } catch (e) {
    console.warn("Error loading feed or schedule:", e);
  }

  // Regular expression for highlighting
  const dateRegex = /^(?:[A-Za-z]+,\s)?([A-Za-z]+)\s(\d{1,2}),\s(\d{4})/;

  const today = new Date();
  let closestDate = null;
  let closestLi = null;
  let minDiff = Infinity;

  schedule.forEach(entry => {
    const parsed = parseScheduleEntry(entry);
    const key = getDateKey(parsed.displayDate);
    let video = key ? videoByDateKey.get(key) : null;
    if (!video) {
      const tKey = titleMatchKey(parsed.title);
      if (tKey) video = videoByTitleKey.get(tKey) || null;
    }

    const li = document.createElement('li');

    if (video) {
      li.classList.add('has-video');
      li.dataset.date = parsed.displayDate;
      // Display date always from schedule when matched (not Rumble pubDate)
      li.innerHTML = renderVideoCard(video, parsed.displayDate, parsed.title);
    } else {
      li.textContent = entry;
      const match = entry.match(dateRegex);
      if (match) {
        li.dataset.date = `${match[1]} ${match[2]}, ${match[3]}`;
      }
    }

    ul.appendChild(li);

    // Highlight calculation (for both types)
    const dateStr = li.dataset.date || li.textContent;
    const match = dateStr.match(dateRegex);
    if (match) {
      const month = match[1];
      const day = parseInt(match[2], 10);
      const year = parseInt(match[3], 10);
      const liDate = new Date(`${month} ${day}, ${year}`);
      const diff = liDate - today;
      if (diff >= 0 && diff < minDiff) {
        minDiff = diff;
        closestDate = liDate;
        closestLi = li;
      }
    }
  });

  if (closestLi) {
    closestLi.classList.add('highlight');
  }

  attachCardClicks();
}

function initTVShowsSnippet() {
  wireRumbleModalHandlers();
  loadAndRenderSchedule();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initTVShowsSnippet);
} else {
  initTVShowsSnippet();
}
