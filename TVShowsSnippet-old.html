<script type="text/javascript">// <![CDATA[
(async function () {
  const FEEDS = [
    "https://jhansenwmi.github.io/rumble-WMI-videos/rumble-feed.json"
  ];

  const statusEl = document.getElementById("tvRwStatus");
  const gridEl = document.getElementById("tvRwGrid");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }

  function normalizeTitle(t) {
    let s = String(t || "").replace(/\s+/g, " ").trim();
    s = stripTVSuffix(s);
    s = stripTrailingDate(s);
    return s;
  }

  function stripTrailingDate(title) {
    const re = /\s*-\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}(?:st|nd|rd|th)?(?:,)?\s+\d{4}\s*$/i;
    return title.replace(re, "").trim();
  }

  function stripTVSuffix(title) {
    return title.replace(/\s*TV\d{8}\s*$/i, "").trim();
  }

  const dateFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    month: "short",
    day: "2-digit",
    year: "numeric"
  });

  function getTVDateMatch(item) {
    // Check title first (e.g. "... TV20260621"), then link / file name (e.g. ...-tv20260621.html)
    let text = item && item.title ? String(item.title) : "";
    let m = text.match(/TV(\d{4})(\d{2})(\d{2})\s*$/i);
    if (!m && item && item.link) {
      text = String(item.link);
      m = text.match(/tv(\d{4})(\d{2})(\d{2})\b/i);
    }
    return m;
  }

  function getTVAirDate(item) {
    const m = getTVDateMatch(item);
    if (!m) return null;

    const y = +m[1];
    const mo = +m[2];
    const d = +m[3];

    // Nominal indicated date at noon UTC (stable for day math and LA formatting)
    let dt = new Date(Date.UTC(y, mo - 1, d, 12, 0, 0));
    const dow = dt.getUTCDay(); // 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat

    if (dow === 5) {
      return dt;
    }

    const toPrev = (dow - 5 + 7) % 7;
    const toNext = (5 - dow + 7) % 7;

    let delta;
    if (toPrev <= toNext) {
      // nearer to (or tied with) previous Friday → pick earlier Friday
      delta = -toPrev;
    } else {
      delta = toNext;
    }

    dt.setUTCDate(dt.getUTCDate() + delta);
    return dt;
  }

  function getTVAirDateStr(item) {
    const dt = getTVAirDate(item);
    if (!dt) return "";
    return dateFmt.format(dt);
  }

  function getTVAirTimestamp(item) {
    const dt = getTVAirDate(item);
    if (!dt) return -Infinity;
    return dt.getTime();
  }

  function getThumb(item) {
    return item && item["media:content"] ? String(item["media:content"]) : "";
  }

  function getLink(item) {
    return item && item.link ? String(item.link) : "#";
  }

  function getVideoId(item) {
    if (item && item.videoId) return String(item.videoId);
    // fallback: parse from link e.g. /v7bokoc-...
    const link = item && item.link ? String(item.link) : "";
    const m = link.match(/\/(v[a-z0-9]+)-/);
    return m ? m[1] : "";
  }

  function isShort(item) {
    const link = getLink(item);
    const source = item && item.sourcePage ? String(item.sourcePage) : "";
    const title = item && item.title ? String(item.title) : "";
    return /\/shorts(\/|$)/i.test(link) || /\/shorts(\/|$)/i.test(source) || /#shorts\b/i.test(title);
  }

  function isTVShowItem(item) {
    const title = item && item.title ? String(item.title) : "";
    return /TV\d{8}\s*$/i.test(title);
  }

  function sortByDateDesc(a, b) {
    const da = getTVAirTimestamp(a);
    const db = getTVAirTimestamp(b);
    return (isNaN(db) ? -Infinity : db) - (isNaN(da) ? -Infinity : da);
  }

  function attachCardClicks() {
    const grid = document.getElementById('tvRwGrid') || document.querySelector('.rw-grid');
    if (!grid) return;
    grid.querySelectorAll('.rw-card[data-video-id]').forEach(card => {
      const videoId = card.getAttribute('data-video-id');
      if (!videoId) return;

      const thumbWrap = card.querySelector('.rw-thumbWrap');
      const titleWrap = card.querySelector('.rw-title');

      const openPlayer = (e) => {
        // allow modifier keys to open direct link
        if (e && (e.metaKey || e.ctrlKey || e.shiftKey)) {
          const lnk = card.getAttribute('data-link');
          if (lnk) window.open(lnk, '_blank');
          return;
        }
        e && e.preventDefault();
        showRumbleOverlay(videoId);
      };

      if (thumbWrap) thumbWrap.style.cursor = 'pointer';
      if (titleWrap) titleWrap.style.cursor = 'pointer';

      if (thumbWrap) thumbWrap.addEventListener('click', openPlayer);
      if (titleWrap) titleWrap.addEventListener('click', openPlayer);

      // also allow whole card as fallback
      card.style.cursor = 'pointer';
      card.addEventListener('click', (e) => {
        // if clicked on the title area already handled, or thumb
        if (e.target.closest('.rw-thumbWrap') || e.target.closest('.rw-title')) return;
        openPlayer(e);
      });
    });
  }

  function showRumbleOverlay(videoCode) {
    if (!videoCode) return;
    let modal = document.getElementById('rumbleModal');
    if (!modal) {
      // in case not yet in DOM, but should be
      return;
    }
    const wrap = document.getElementById('rumblePlayerWrap');
    if (!wrap) return;

    const playerId = 'rumble_embed_' + videoCode.replace(/[^a-z0-9]/gi, '');
    wrap.innerHTML = `<div id="${playerId}" style="width:100%; aspect-ratio:16/9; min-height: 300px;"></div>`;

    modal.style.display = 'flex';

    const doPlay = () => {
      if (window.Rumble && typeof window.Rumble === 'function') {
        try { window.Rumble("play", { video: videoCode, div: playerId }); }
        catch (err) { console.warn('Rumble play error', err); }
      } else {
        setTimeout(doPlay, 250);
      }
    };
    setTimeout(doPlay, 60);
  }

  function closeRumbleOverlay() {
    const modal = document.getElementById('rumbleModal');
    const wrap = document.getElementById('rumblePlayerWrap');
    if (modal) modal.style.display = 'none';
    if (wrap) wrap.innerHTML = '';
  }

  async function fetchFeed(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
    return res.json();
  }

  try {
    const results = await Promise.allSettled(FEEDS.map(fetchFeed));
    var items = [];
    const errors = [];

    for (const r of results) {
      if (r.status === "fulfilled") {
        const data = r.value;
        if (data && Array.isArray(data.items)) items.push(...data.items);
      } else {
        errors.push(r.reason);
      }
    }

    if (items.length === 0) {
      statusEl.textContent = "No videos loaded.";
      console.error("Feed load errors:", errors);
      return;
    }

    items = items.filter(isTVShowItem);

    if (items.length === 0) {
      statusEl.textContent = "No TV shows found.";
      return;
    }

    items.sort(sortByDateDesc);
    items = items.slice(0, 30);

    const html = items.map(item => {
      const title = normalizeTitle(item.title);
      const link = getLink(item);
      const thumb = getThumb(item);
      const date = getTVAirDateStr(item);
      const videoId = getVideoId(item);
      const shortClass = isShort(item) ? " rw-card--short" : "";
      const thumbStyle = thumb ? ` style="--rw-thumb-bg: url('${escapeHtml(thumb)}')"` : "";

      return `
        <div class="rw-card${shortClass}" data-video-id="${escapeHtml(videoId)}" data-link="${escapeHtml(link)}">
          <div class="rw-thumbWrap"${thumbStyle}>
            ${thumb ? `<img class="rw-thumb" src="${escapeHtml(thumb)}" >` : ""}
          </div>

          <div class="rw-meta">
            <div class="rw-title">${escapeHtml(title || "Untitled")}</div>
            <div class="rw-date">${escapeHtml(date)}</div>
          </div>
        </div>
      `;
    }).join("");

    gridEl.innerHTML = html;
    gridEl.style.display = "grid";

    attachCardClicks();

    // Wire modal close handlers
    const modal = document.getElementById('rumbleModal');
    if (modal) {
      const closeBtn = document.getElementById('rumbleModalClose');
      if (closeBtn) closeBtn.onclick = closeRumbleOverlay;
      modal.onclick = (e) => { if (e.target === modal) closeRumbleOverlay(); };
    }

    if (errors.length) {
      statusEl.textContent = "Loaded videos, but one or more feeds failed.";
      console.warn("Some feeds failed:", errors);
    } else {
      statusEl.style.display = "none";
    }
  } catch (err) {
    statusEl.textContent = "Failed to load videos. Check console for details.";
    console.error(err);
  }
})();
