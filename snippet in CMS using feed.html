<script type="text/javascript">// <![CDATA[
(async function () {
const FEEDS = [
  "https://jhansenwmi.github.io/rumble-WMI-videos/rumble-feed.json"
];

  const statusEl = document.getElementById("rwStatus");
  const gridEl = document.getElementById("rwGrid");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }

  function normalizeTitle(t) {
    let s = String(t || "").replace(/\s+/g, " ").trim();
    s = stripTVSuffix(s);
    s = stripTrailingDate(s);
    return s;
  }

  function stripTrailingDate(title) {
    const re = /\s*-\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}(?:st|nd|rd|th)?(?:,)?\s+\d{4}\s*$/i;
    return title.replace(re, "").trim();
  }

  function stripTVSuffix(title) {
    return title.replace(/\s*TV\d{8}\s*$/i, "").trim();
  }

  const dateFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    month: "short",
    day: "2-digit",
    year: "numeric"
  });

  function formatDateLA(pubDateStr) {
    const d = new Date(pubDateStr);
    if (isNaN(d.getTime())) return "";
    return dateFmt.format(d);
  }

  function getThumb(item) {
    return item && item["media:content"] ? String(item["media:content"]) : "";
  }

  function getLink(item) {
    return item && item.link ? String(item.link) : "#";
  }

  function getVideoId(item) {
    if (item && item.videoId) return String(item.videoId);
    const link = item && item.link ? String(item.link) : "";
    const m = link.match(/\/(v[a-z0-9]+)-/);
    return m ? m[1] : "";
  }

  const RUMBLE_MODAL_Z_INDEX = 10000;

  function ensureRumbleModalPortal() {
    const modal = document.getElementById('rumbleModal');
    if (!modal) return null;
    if (modal.parentNode !== document.body) {
      document.body.appendChild(modal);
    }
    modal.style.zIndex = String(RUMBLE_MODAL_Z_INDEX);
    return modal;
  }

  function showRumbleOverlay(videoCode) {
    if (!videoCode) return;
    wireRumbleModalHandlers();
    const modal = ensureRumbleModalPortal();
    if (!modal) return;
    const wrap = document.getElementById('rumblePlayerWrap');
    if (!wrap) return;
    const playerId = 'rumble_embed_' + videoCode.replace(/[^a-z0-9]/gi, '');
    wrap.innerHTML = `<div id="${playerId}" style="width:100%; aspect-ratio:16/9; min-height: 300px;"></div>`;
    modal.style.display = 'flex';
    const doPlay = () => {
      if (window.Rumble && typeof window.Rumble === 'function') {
        try { window.Rumble("play", { video: videoCode, div: playerId }); }
        catch (err) { console.warn('Rumble play error', err); }
      } else {
        setTimeout(doPlay, 250);
      }
    };
    setTimeout(doPlay, 60);
  }

  function closeRumbleOverlay() {
    const modal = document.getElementById('rumbleModal');
    const wrap = document.getElementById('rumblePlayerWrap');
    if (modal) modal.style.display = 'none';
    if (wrap) wrap.innerHTML = '';
  }

  let rumbleModalHandlersWired = false;
  function wireRumbleModalHandlers() {
    if (rumbleModalHandlersWired) return;
    const modal = ensureRumbleModalPortal();
    const closeBtn = document.getElementById('rumbleModalClose');
    if (!modal || !closeBtn) return;
    rumbleModalHandlersWired = true;
    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      closeRumbleOverlay();
    });
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeRumbleOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      const m = document.getElementById('rumbleModal');
      if (m && m.style.display === 'flex') closeRumbleOverlay();
    });
  }

  function attachCardClicks() {
    gridEl.querySelectorAll('.rw-card[data-video-id]').forEach(card => {
      const videoId = card.getAttribute('data-video-id');
      if (!videoId) return;
      const openPlayer = (e) => {
        if (e && (e.metaKey || e.ctrlKey || e.shiftKey)) {
          const lnk = card.getAttribute('data-link');
          if (lnk) window.open(lnk, '_blank');
          return;
        }
        e && e.preventDefault();
        showRumbleOverlay(videoId);
      };
      card.style.cursor = 'pointer';
      card.addEventListener('click', openPlayer);
    });
  }

  function getPubDate(item) {
    return item && item.pubDate ? String(item.pubDate) : "";
  }

  function isShort(item) {
    const link = getLink(item);
    const source = item && item.sourcePage ? String(item.sourcePage) : "";
    const title = item && item.title ? String(item.title) : "";
    return /\/shorts(\/|$)/i.test(link) || /\/shorts(\/|$)/i.test(source) || /#shorts\b/i.test(title);
  }

  function shouldExclude(item) {
    const source = item && item.sourcePage ? String(item.sourcePage) : "";
    const ch = item && item.channelName ? String(item.channelName) : "";
    if (/\/shorts(\/|$)/i.test(source) && /The Overcoming Women$/i.test(ch)) return true;
    return false;
  }

  function isTVShowItem(item) {
    const title = item && item.title ? String(item.title) : "";
    return /TV\d{8}\s*$/i.test(title);
  }

  function sortByDateDesc(a, b) {
    const da = new Date(getPubDate(a)).getTime();
    const db = new Date(getPubDate(b)).getTime();
    return (isNaN(db) ? -Infinity : db) - (isNaN(da) ? -Infinity : da);
  }

  async function fetchFeed(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
    return res.json();
  }

  try {
    const results = await Promise.allSettled(FEEDS.map(fetchFeed));

    var items = [];
    const errors = [];

    for (const r of results) {
      if (r.status === "fulfilled") {
        const data = r.value;
        if (data && Array.isArray(data.items)) items.push(...data.items);
      } else {
        errors.push(r.reason);
      }
    }

    if (items.length === 0) {
      statusEl.textContent = "No items loaded.";
      console.error("Feed load errors:", errors);
      return;
    }

    items = items.filter(item => !shouldExclude(item) && !isTVShowItem(item));

    items.sort(sortByDateDesc);

    items = items.slice(0, 30);

    const html = items.map(item => {
      const title = normalizeTitle(item.title);
      const link = getLink(item);
      const thumb = getThumb(item);
      const date = formatDateLA(getPubDate(item));
      const videoId = getVideoId(item);
      const shortClass = isShort(item) ? " rw-card--short" : "";
      const thumbStyle = thumb ? ` style="--rw-thumb-bg: url('${escapeHtml(thumb)}')"` : "";

      return `
        <div class="rw-card${shortClass}" data-video-id="${escapeHtml(videoId)}" data-link="${escapeHtml(link)}">
          <div class="rw-thumbWrap"${thumbStyle}>
            ${thumb ? `<img class="rw-thumb" src="${escapeHtml(thumb)}" >` : ""}
          </div>

          <div class="rw-meta">
            <div class="rw-title">${escapeHtml(title || "Untitled")}</div>
            <div class="rw-date">${escapeHtml(date)}</div>
          </div>
        </div>
      `;
    }).join("");

    gridEl.innerHTML = html;
    gridEl.style.display = "grid";
    attachCardClicks();
    wireRumbleModalHandlers();

    if (errors.length) {
      statusEl.textContent = "Loaded videos (one or more feeds failed).";
      console.warn("Some feeds failed:", errors);
    } else {
      statusEl.style.display = "none";
    }
  } catch (err) {
    statusEl.textContent =
      "Failed to load videos. Check console for details.";
    console.error(err);
  }
})();
// ]]></script>

<script type="text/javascript">// <![CDATA[
(function () {
  const WORKER_BASE = "https://divine-dew-3ed7.jonathan-hansen-ministries.workers.dev";
  const PAGE_ID = "watch-warning"; // CHANGE PER PAGE: watch-warning | reading | donate

  const overlay = document.getElementById("statsModalOverlay");
  const content = document.getElementById("statsModalContent");
  const btnClose = document.getElementById("statsModalCloseBtn");
  const btnOk = document.getElementById("statsModalOkBtn");
  const btnCopy = document.getElementById("statsModalCopyBtn");
  const counterBox = document.getElementById("counterBox");

  if (!overlay || !content || !btnClose || !btnOk || !btnCopy || !counterBox) return;

  let busy = false;
  let lastDay = null;
  let lastMonth = null;

  function setCounterText(extra) {
    const day = (lastDay ?? "?");
    const month = (lastMonth ?? "?");
    counterBox.innerText = `Day: ${day} | Month: ${month}` + (extra ? ` ${extra}` : "");
  }

  function setBusy(on) {
    busy = on;
    counterBox.style.pointerEvents = on ? "none" : "auto";
    setCounterText(on ? "(checking)" : "");
  }

  function closeModal() {
    overlay.style.display = "none";
    if (busy) setBusy(false);
  }

  function openModal(text) {
    content.textContent = text || "";
    overlay.style.display = "flex";
  }

  btnClose.addEventListener("click", closeModal);
  btnOk.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e) => { if (overlay.style.display === "flex" && e.key === "Escape") closeModal(); });

  btnCopy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(content.textContent || "");
      btnCopy.textContent = "Copied";
      setTimeout(() => (btnCopy.textContent = "Copy"), 1200);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = content.textContent || "";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      btnCopy.textContent = "Copied";
      setTimeout(() => (btnCopy.textContent = "Copy"), 1200);
    }
  });

  const sessionKey = "wm_counted:" + PAGE_ID;
  const endpoint = sessionStorage.getItem(sessionKey) ? "/peek" : "/count";

  fetch(WORKER_BASE + endpoint + "?page=" + encodeURIComponent(PAGE_ID))
    .then(r => r.json())
    .then(data => {
      if (!sessionStorage.getItem(sessionKey) && !data.skipped) {
        sessionStorage.setItem(sessionKey, "1");
      }
      lastDay = data.day;
      lastMonth = data.month;
      setCounterText("");
    })
    .catch(() => setCounterText("(counts unavailable)"));

  counterBox.addEventListener("click", () => {
    if (busy) return;
    setBusy(true);

    fetch(WORKER_BASE + "/stats?page=" + encodeURIComponent(PAGE_ID))
      .then(r => r.json())
      .then(data => {
        const days = data.last60days || [];
        const top = data.topIPsToday || [];

        let text = "Last 60 Days:\n";
        days.forEach(d => {
          const adj = (d.countMinusTopIps ?? "(n/a)");
          text += `${d.date}: ${d.count} (minus top IPs: ${adj})\n`;
        });

        text += "\nTop 3 IP hashes today:\n";
        top.forEach(x => {
          text += `${String(x.ipHash).slice(0,12)}... : ${x.count}\n`;
        });

        openModal(text);
      })
      .catch(err => openModal("Could not load stats:\n" + err));
  });

})();
// ]]></script>
